  <noscript>

      style="padding: 2rem; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 800px; margin: 0 auto; line-height: 1.6;">
      <h1>TimeClash - The Ultimate Historical Timeline Game</h1>
      <p>
        <strong>TimeClash</strong> is a competitive historical timeline game inspired by <em>Chronology</em>.
        Put your history knowledge to the test by placing events in their correct chronological order.
        Play solo to beat your high score, or challenge friends to real-time 1v1 battles where every year counts!
      </p>
      <h2>How to Play</h2>
      <ol>
        <li><strong>Get a Card:</strong> You're presented with a historical event card.</li>
        <li><strong>Place It:</strong> Drag or click to place it on your timeline relative to other events.</li>
        <li><strong>Score:</strong> Correct placements earn points. Incorrect ones cost you a strike!</li>
        <li><strong>Win:</strong> Be the first to correctly place 10 cards to win the game.</li>
      </ol>
      <h2>Key Features</h2>
      <ul>
        <li><strong>Competitive Multiplayer:</strong> Real-time 1v1 battles with live updates.</li>
        <li><strong>The "Steal" Mechanic:</strong> If your opponent messes up, steal their turn and place the card
          yourself!</li>
        <li><strong>Extensive Database:</strong> Thousands of events from ancient history to modern pop culture.</li>
      </ul>
      <p>Please enable JavaScript to run TimeClash in your browser.</p>
    </div>
  </noscript>
